services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservecore
      POSTGRES_USER: reservecore
      POSTGRES_PASSWORD: reservecore
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservecore -d reservecore"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      PORT: 5000
      DATABASE_URL: postgres://reservecore:reservecore@postgres:5432/reservecore
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-this-access-secret
      JWT_REFRESH_SECRET: change-this-refresh-secret
      NODE_ENV: development
    ports: ["5000:5000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    command: ["node", "src/workers/notificationWorker.js"]
    environment:
      DATABASE_URL: postgres://reservecore:reservecore@postgres:5432/reservecore
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-this-access-secret
      JWT_REFRESH_SECRET: change-this-refresh-secret
      NODE_ENV: development
      NOTIFICATION_FAILURE_RATE: "0.30"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  pgdata:
